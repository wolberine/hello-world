version: '3.9'
services:
  db:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: \\${POSTGRES_DB}
      POSTGRES_USER: \\${POSTGRES_USER}
      POSTGRES_PASSWORD: \\${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
  app:
    build:
      context: ./app
    command: uvicorn app.main:app --host ${APP_HOST} --port ${APP_PORT} --reload
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      SDK_GATEWAY_READONLY: ${SDK_GATEWAY_READONLY}
      RUNNER_URL: ${RUNNER_URL}
      SDK_GATEWAY_URL: http://app:8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  runner:
    build:
      context: ./runner
    command: uvicorn runner.main:app --host ${RUNNER_HOST} --port ${RUNNER_PORT} --reload
    environment:
      RUNNER_HOST: ${RUNNER_HOST}
      RUNNER_PORT: ${RUNNER_PORT}
      SDK_GATEWAY_URL: ${SDK_GATEWAY_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./runner:/runner
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
