[project]
name = "nmc-app"
version = "0.1.0"
description = "AI workflow nucleus app service"
authors = [{name = "NMC"}]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.5",
  "httpx>=0.25",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.6",
  "pyyaml>=6.0",
  "croniter>=1.4"
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "respx", "pytest-asyncio"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
